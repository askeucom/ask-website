  const size=()=>{ const r=cv.getBoundingClientRect(); w=r.width; h=r.height; cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  size();
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const N=Math.max(18,Math.min(42,Math.round(w/34)));
  const pts=Array.from({length:N},()=>({x:rnd()*w,y:rnd()*h,vx:(rnd()-.5)*.25,vy:(rnd()-.5)*.25,r:1.2+rnd()*1.8}));
  const draw=(time)=>{ ctx.clearRect(0,0,w,h);
    const hub={x:w*.72,y:h*.48};
    for(let i=0;i<N;i++){ const a=pts[i];
      for(let j=i+1;j<N;j++){ const b=pts[j]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(d<130){ ctx.globalAlpha=(1-d/130)*.35; ctx.strokeStyle=acc; ctx.lineWidth=.7; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } }
      const dh=Math.hypot(a.x-hub.x,a.y-hub.y); if(dh<240 && i%3===0){ const pulse=(Math.sin(time/700+i)+1)/2; ctx.globalAlpha=.12+pulse*.25; ctx.strokeStyle=good; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(hub.x,hub.y); ctx.stroke(); }
      ctx.globalAlpha=.7; ctx.fillStyle=acc; ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1; };
  const step=(time)=>{ for(const p of pts){ p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>w) p.vx*=-1; if(p.y<0||p.y>h) p.vy*=-1; } draw(time); RAF=requestAnimationFrame(step); };
  if(reduced()) draw(0); else RAF=requestAnimationFrame(step);
  window.addEventListener("resize",size,{once:true});
}
function startPipe(){

function startTrace(){
  const s=[...document.querySelectorAll("#trace span")]; if(!s.length) return;
  if(reduced()){ s.forEach(x=>x.classList.add("done")); return; }
  let i=0; const tick=()=>{ if(i<s.length){ s.forEach((x,j)=>{ x.classList.toggle("done",j<i); x.classList.toggle("on",j===i); }); i++; } else { s.forEach(x=>{x.classList.remove("on");x.classList.add("done");}); i=0; } };
  tick(); TIMERS.push(setInterval(tick,900));
}

  const rb=r.getBoundingClientRect(), dot=el=>{ const d=el.querySelector("i").getBoundingClientRect(); return d.left-rb.left+d.width/2; };
  const rail=r.querySelector(".rail"); const x0=dot(stops[0]), x1=dot(stops.at(-1)); rail.style.left=x0+"px"; rail.style.width=(x1-x0)+"px";
  const el=target||r.querySelector(".stop.on");
  if(el){ tr.style.left=dot(el)+"px"; tr.classList.add("show"); const on=r.querySelector(".stop.on"); rail.style.setProperty("--fill", on? (dot(on)-x0)+"px" : "0px"); }

function srcFor(text){
  const s=text||"";
  if(/883\/2004/.test(s)) return SRC.r883;
  if(/987\/2009/.test(s)) return SRC.r987;
  if(/2011\/24/.test(s)) return SRC.d24;
  if(/2001\/55/.test(s)) return SRC.d55;
  if(/2017\/745/.test(s)) return SRC.mdr;
  if(/2024\/1689/.test(s)) return SRC.aia;
  if(/2025\/327/.test(s)) return SRC.ehds;
  if(/2016\/679/.test(s)) return SRC.gdpr;
  if(/Eurostat/i.test(s)) return SRC.eurostat;
  if(/Rechnungshof|Court of Auditors|Trybunał|рахунков/i.test(s)) return SRC.eca;
  if(/insurance fund|Nationale Krankenkasse|fundusz ubezpieczenia|страховий фонд/i.test(s)) return SRC.fund;
  if(/contact point|Kontaktstelle|punkt kontaktowy|контактн/i.test(s)) return SRC.ncp;
  if(/EHIC|EKVK|EKUZ|ЄКМС|European Health Insurance Card/i.test(s)) return SRC.ehic;

}

- If the person's country is not given or is not Germany, use the EU-wide rules (EU-xx) and say in one point that details differ from country to country and where to check (EU-12). Use the DE-TP rules only for people with temporary protection in Germany.
- If a rule you use has STATUS: CHANGING, say clearly in that point that the rule is changing and the person should check their current status.
- If the question mentions a medical emergency, the first point must be to call 112 (rule EU-01). Never diagnose, never name possible causes and never suggest treatment or medicines. If the person only describes symptoms, point 1 says to call 112 if it is an emergency (EU-01); the other points use the rules to explain how care is covered where they are, for example through the EHIC (EU-02, EU-04, EU-07) or the local insurance (DE-TP rules for Germany).
- status "answered": the rules fully answer the question. "partial": they answer part of it; say in one point what is not covered. "unknown": the rules do not answer it, or it is outside the scope (details of a national system that the rules do not contain, a diagnosis or treatment advice): then give no invented content, one point saying this is not in the checked rules, and use "contact" to name who to ask, based on rule EU-12 (National Contact Point, your own health insurer) and, for Germany, rule DE-TP-23.
- "contact": one short sentence naming who to contact for this question, only from the rules.

Reply with only this JSON:
{"status":"answered|partial|unknown","points":[{"text":"...","rules":["DE-TP-04"]}],"contact":"..."}

CHECKED RULES (last checked ${LIVE_LIB.checked}):
${rules}

QUESTION:
${q}`;
}

function liveRender(res, q){
  const out = gid("liveout"); if(!out) return;
  let pts = Array.isArray(res&&res.points) ? res.points : [];
  const total = pts.length;
  pts = pts.map(p=>({text:String(p&&p.text||"").trim(), rules:(Array.isArray(p&&p.rules)?p.rules:[]).map(String).filter(id=>LIVE_BY_ID[id])})).filter(p=>p.text);
  const linked = pts.filter(p=>p.rules.length);
  let status = ["answered","partial","unknown"].includes(res&&res.status) ? res.status : "unknown";
  if(status!=="unknown" && !linked.length) status="unknown";
  const shown = status==="unknown" ? pts.slice(0,2) : linked;
  const used = [...new Set(shown.flatMap(p=>p.rules))].map(id=>LIVE_BY_ID[id]);
  const changing = used.some(r=>r.status==="changing");
  const icon = {answered:"✓", partial:"◐", unknown:"?"}[status];
  window.LIVE_LAST = {q, text: shown.map(p=>p.text).join("\n")};
  out.innerHTML = `<div class="lq">${esc(q)}</div>
    <div class="la">
      <div class="latop"><span class="ailabel">${t('ai_label')}</span><span class="lstat s-${status}"><i>${icon}</i>${t('live_st_'+status)}</span></div>
      ${shown.length?`<ol class="lpts">${shown.map(p=>`<li>${esc(p.text)}${p.rules.length?` <span class="lrefs">${p.rules.map(id=>`<a href="#rule-${id}" data-rule="${id}">${id.replace("DE-TP-","R")}</a>`).join("")}</span>`:""}</li>`).join("")}</ol>`:""}
      ${changing?`<div class="callout lwarn">${t('live_changing')}</div>`:""}
      ${res&&res.contact?`<p class="lcontact"><b>${t('live_contact')}:</b> ${esc(String(res.contact))}</p>`:""}
      ${used.length?`<div class="lused"><b>${t('live_sources')}</b><ul>${used.map(r=>`<li><code>${r.id.replace("DE-TP-","R")}</code> ${esc(r.topic)} · <a class="srclink" href="${r.url}" target="_blank" rel="noopener">${esc(r.source)}${EXT_SVG}</a></li>`).join("")}</ul></div>`:""}
      ${status!=="unknown"?`<p class="lcheck">${tf('live_check',{k:linked.length,n:total})}</p>`:""}

    </div>`;
}

const liveRemote = () => (window.ASKEU_CONFIG && window.ASKEU_CONFIG.aiUrl) || "";
const liveAvailable = () => !!((window.claude && window.claude.use) || liveRemote());
async function liveJson(q, signal){
  const sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
  if(sample) return sample.json(livePrompt(q), {modelTier:"quick", signal});
  const url = liveRemote(); if(!url){ const e=new Error("off"); e.code="not_declared"; throw e; }
  const r = await fetch(url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({q,lang}),signal});
  if(r.status===429){ const e=new Error("rate"); e.code="rate_limited"; throw e; }
  if(!r.ok) throw new Error("http "+r.status);
  return r.json();
}
async function liveAsk(q){
  const out=gid("liveout"), btn=gid("livebtn"); if(!out) return;
  q=(q||"").trim(); if(!q){ out.innerHTML=`<p class="ferr">${t('live_q_empty')}</p>`; return; }
  if(!liveAvailable()){ out.innerHTML=`<div class="callout">${t('live_off')}</div>`; return; }
  LIVE_CTL?.abort(); LIVE_CTL = new AbortController();
  btn.disabled=true;
  const steps=[t('live_t1'),tf('live_t2',{n:LIVE_N}),t('live_t3'),t('live_t4')];
  out.innerHTML=`<div class="lq">${esc(q)}</div><ol class="ltrace">${steps.map((s,i)=>`<li data-i="${i}">${esc(s)}</li>`).join("")}</ol>`;
  let i=0; const tick=()=>{ const li=out.querySelectorAll(".ltrace li"); li.forEach((x,j)=>{ x.classList.toggle("done",j<i); x.classList.toggle("on",j===i); }); };
  tick(); const timer=setInterval(()=>{ if(i<2){ i++; tick(); } },900);
  try{
    const res = await liveJson(q, LIVE_CTL.signal);
    clearInterval(timer); i=3; tick(); await new Promise(r=>setTimeout(r,450));
    liveRender(res, q);
  }catch(e){
    clearInterval(timer);
    if(e&&e.code==="cancelled") return;
    const k = (e&&(e.code==="not_granted"||e.code==="sampling_disabled"||e.code==="not_declared")) ? 'live_denied' : (e&&e.code==="rate_limited") ? 'live_rate' : 'live_err';
    out.innerHTML=`<div class="lq">${esc(q)}</div><div class="callout">${t(k)}</div>`;
  }finally{ btn.disabled=false; }
}

/* Hero chat: free-text questions without a canned match go to the live AI when it is available */
(function(){
  const _chatRun = chatRun;
  chatRun = function(sit, question, matched, instant){
    if(sit || instant || reduced() || !liveAvailable()) return _chatRun(sit, question, matched, instant);
    const log=document.getElementById("chatlog"); if(!log) return;
    const my=++CHAT_TOKEN; PENDING_Q=question;
    log.innerHTML=`<div class="msg q">${esc(question)}</div><div class="msg a thinking" id="think"><span class="dots"><i></i><i></i><i></i></span><span>${t('chat_think')}</span></div>`;
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),25000);
    const fallback=()=>{ if(my!==CHAT_TOKEN) return; const th=document.getElementById("think"); if(th) th.remove(); log.innerHTML=""; _chatRun(null, question, false, true); };
    liveJson(question, ctl.signal).then(res=>{
      clearTimeout(to); if(my!==CHAT_TOKEN) return;
      let pts=(Array.isArray(res&&res.points)?res.points:[]).map(p=>({text:String(p&&p.text||"").trim(), rules:(Array.isArray(p&&p.rules)?p.rules:[]).map(String).filter(id=>LIVE_BY_ID[id])})).filter(p=>p.text&&p.rules.length);
      const st=["answered","partial"].includes(res&&res.status)?res.status:"unknown";
      if(st==="unknown"||!pts.length) return fallback();
      const used=[...new Set(pts.flatMap(p=>p.rules))].map(id=>LIVE_BY_ID[id]);
      const th=document.getElementById("think"); if(th) th.remove();
      log.insertAdjacentHTML("beforeend",`<div class="msg a"><div class="latop"><span class="ailabel">${t('ai_label')}</span><span class="lstat s-${st}"><i>${st==="answered"?"✓":"◐"}</i>${t('live_st_'+st)}</span></div>
        <ol class="lpts">${pts.map(p=>`<li>${esc(p.text)}</li>`).join("")}</ol>
        ${res.contact?`<p class="lcontact"><b>${t('live_contact')}:</b> ${esc(String(res.contact))}</p>`:""}
        <div class="cites">${used.map(r=>`<a class="cite srclink" href="${r.url}" target="_blank" rel="noopener">${esc(r.source)}${EXT_SVG}</a>`).join("")}</div>
        <div class="chatact"><a class="btn primary sm" href="#early-access" data-saveq>${t('chat_save')}</a><button type="button" class="btn ghost sm" data-more>${t('chat_more')}</button></div></div>`);
      wireChatActions();
    }).catch(()=>{ clearTimeout(to); fallback(); });
  };
})();
