<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>ask.eu.com</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Onest:wght@400;500;600;700&family=Martian+Mono:wdth,wght@75..112.5,400..600&display=swap">
<style>
/* Layout: a document-grade site — wide hero with a live navigator card, then alternating full-width bands; official-register typography (Plex) with a characterful display face (Bricolage). */
:root{
  --bg:#F4F7FB; --surface:#FFFFFF; --surface-2:#EAF0F8; --ink:#0E1A2E; --muted:#56657C; --line:#D6DEE9;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB; --good:#166534; --good-soft:#E3F3E8; --warn:#92400E; --warn-soft:#FBEEDB;
  --shadow:0 18px 50px -20px rgba(14,26,46,.25);
  --display:'Spectral',Georgia,'Times New Roman',serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'Martian Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:14px; --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --surface:#111A2C; --surface-2:#172339; --ink:#E9EEF7; --muted:#9AA8BF; --line:#263349;
  --accent:#6B8DFF; --accent-ink:#0A1220; --accent-soft:#1A2A52; --good:#4ADE80; --good-soft:#13331F; --warn:#FBBF24; --warn-soft:#3A2A0C;
  --shadow:0 18px 50px -20px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#111A2C; --surface-2:#172339; --ink:#E9EEF7; --muted:#9AA8BF; --line:#263349;
  --accent:#6B8DFF; --accent-ink:#0A1220; --accent-soft:#1A2A52; --good:#4ADE80; --good-soft:#13331F; --warn:#FBBF24; --warn-soft:#3A2A0C;
  --shadow:0 18px 50px -20px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.08;letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:clamp(2.3rem,5.4vw,4.4rem);font-weight:800}
h2{font-size:clamp(1.7rem,3.3vw,2.6rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.eyebrow{font-family:var(--mono);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:500}
.lead{font-size:1.15rem;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:18px;height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--mono);font-weight:500;font-size:.95rem}
.logo .dot{color:var(--accent)}
nav.main{display:flex;gap:4px;margin-left:12px}
nav.main a{text-decoration:none;color:var(--muted);font-weight:500;font-size:.93rem;padding:8px 11px;border-radius:9px}
nav.main a:hover{color:var(--ink);background:var(--surface-2)}
nav.main a.on{color:var(--ink);background:var(--surface-2)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 28px 7px 10px;font:inherit;font-size:.86rem;font-weight:500;cursor:pointer}
.lang::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;border:1px solid transparent;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px -10px var(--accent)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.sm{padding:8px 13px;font-size:.88rem;border-radius:9px}
.burger{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;place-items:center}
.burger span{display:block;width:16px;height:2px;background:var(--ink);margin:2px 0;border-radius:2px}
.mnav{display:none;border-top:1px solid var(--line);background:var(--bg)}
.mnav .wrap{display:flex;flex-direction:column;padding-block:8px 14px}
.mnav a{text-decoration:none;padding:11px 6px;font-weight:500;border-bottom:1px solid var(--line)}
.mnav a:last-child{border-bottom:0}
.mnav.open{display:block}
@media (max-width:900px){nav.main{display:none}.burger{display:grid}.hdr-cta{display:none}}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .glow{position:absolute;inset:auto;width:60vw;max-width:760px;aspect-ratio:1;border-radius:50%;filter:blur(80px);opacity:.45;pointer-events:none}
.hero .g1{background:var(--accent);top:-30%;right:-10%;animation:drift 18s ease-in-out infinite alternate}
.hero .g2{background:var(--good);bottom:-40%;left:-15%;opacity:.22;animation:drift 22s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-6%,8%) scale(1.08)}}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:72px 64px}
.hero-copy{display:flex;flex-direction:column;gap:22px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.86rem}
.trust span{display:inline-flex;align-items:center;gap:7px}
.trust i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;padding-block:44px 40px}}

/* navigator card */
.navcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.navcard .bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.navcard .bar b{color:var(--ink);font-weight:500}
.navcard .live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--good)}
.navcard .live i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}}
.chat{display:flex;flex-direction:column;gap:14px;padding:18px}
.msg{max-width:92%;padding:12px 15px;border-radius:14px;font-size:.95rem;line-height:1.5}
.msg.q{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;animation:rise .5s both}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px;animation:rise .5s .35s both;display:flex;flex-direction:column;gap:10px;max-width:100%}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.route{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.86rem;min-width:0}
.route b{display:block;font-family:var(--display);font-size:.98rem}
.route .amt{font-family:var(--mono);color:var(--accent);font-weight:500}
.cites{display:flex;flex-wrap:wrap;gap:6px}
.cite{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;padding:4px 8px;border-radius:7px;background:var(--good-soft);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 30%,transparent)}
.cite::before{content:"✓"}
.verified{font-size:.78rem;color:var(--muted);font-family:var(--mono)}
@media (max-width:480px){.routes{grid-template-columns:1fr}}

/* bands */
section.band{padding-block:72px}
section.band.alt{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{display:flex;flex-direction:column;gap:12px;max-width:720px;margin-bottom:40px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:900px){.grid3,.grid4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.grid3,.grid4,.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .ic{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:.85rem}
.card p{color:var(--muted);font-size:.95rem}
.step{position:relative;padding-left:0}
.step .n{font-family:var(--display);font-size:2.6rem;font-weight:800;color:var(--accent);line-height:1;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:26px}
.stat b{display:block;font-family:var(--display);font-size:2.2rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.9rem}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:.78rem;padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* demo */
.demo{display:grid;grid-template-columns:400px 1fr;gap:24px;align-items:start}
@media (max-width:900px){.demo{grid-template-columns:1fr}}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:600}
.field select,.field input,.field textarea{font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.field textarea{min-height:120px;resize:vertical}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.answer h3{font-size:1.3rem}
.answer ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.callout{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.9rem}
.disclaim{font-size:.8rem;color:var(--muted)}

/* persona / countries */
.persona{display:flex;gap:14px}
.persona .ic{flex:none}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.ctile{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:.92rem;min-width:0}
.ctile .cc{font-family:var(--mono);font-size:.75rem;color:var(--muted);width:26px;flex:none}
.ctile .tag{margin-left:auto;font-family:var(--mono);font-size:.68rem;padding:2px 6px;border-radius:5px;background:var(--good-soft);color:var(--good);flex:none}
.ctile .tag.eu{background:var(--surface-2);color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:14px}

/* pricing */
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:stretch}
@media (max-width:1000px){.plans{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.plans{grid-template-columns:1fr}}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:14px}
.plan.hi{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.plan .price{font-family:var(--display);font-size:2.3rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.plan .price small{font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted);letter-spacing:0}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.92rem;flex:1}
.plan li{display:flex;gap:9px;align-items:flex-start}
.plan li::before{content:"✓";color:var(--good);font-weight:700;flex:none}
.plan .badge{align-self:flex-start;font-family:var(--mono);font-size:.7rem;padding:3px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}

/* faq */
.faq{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;padding:18px 0;font-weight:600;font-size:1.02rem;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::after{content:"+";color:var(--accent);font-family:var(--mono);font-size:1.3rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq .body{padding:0 0 18px;color:var(--muted);max-width:70ch}

/* cta / footer */
.cta{background:var(--ink);color:var(--bg);border-radius:24px;padding:48px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;right:-20%;top:-60%;width:60%;aspect-ratio:1;border-radius:50%;background:var(--accent);filter:blur(70px);opacity:.5}
.cta h2{color:inherit}
.cta p{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.cta .ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;position:relative}
@media (max-width:800px){.cta{grid-template-columns:1fr;padding:32px 22px}.cta .ctas{justify-content:flex-start}}
footer{border-top:1px solid var(--line);background:var(--surface);padding-block:48px 28px}
.fgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:28px}
@media (max-width:800px){.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:500px){.fgrid{grid-template-columns:1fr}}
.fcol{display:flex;flex-direction:column;gap:9px;font-size:.92rem}
.fcol b{font-family:var(--display);font-weight:700;margin-bottom:4px}
.fcol a{text-decoration:none;color:var(--muted)}
.fcol a:hover{color:var(--ink)}
.fbottom{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.email{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);background:var(--surface-2);border:1px solid var(--line);padding:9px 12px;border-radius:10px;font-size:.92rem;user-select:all}
.email button{font:inherit;font-size:.75rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 8px;cursor:pointer}

/* page header + prose */
.pagehead{padding-block:56px 36px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:16px;font-size:1.02rem}
.prose h3{margin-top:14px}
.prose ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:70;transition:opacity .3s;pointer-events:none}
.fade{animation:fadein .4s both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ok{background:var(--good-soft);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:12px;padding:14px 16px;font-size:.95rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>
/* v2 additions: AI-first blocks */
.logo .word{display:inline-flex;align-items:baseline}
.status-pill{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-family:var(--mono);font-size:.76rem;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.status-pill i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.trace{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 16px}
.trace span{font-family:var(--mono);font-size:.74rem;padding:4px 8px;border-radius:7px;border:1px solid var(--line);color:var(--muted);background:var(--surface);transition:all .3s}
.trace span.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.trace span.done{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent);background:var(--good-soft)}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;counter-reset:p}
@media (max-width:1000px){.pipe{grid-template-columns:repeat(3,1fr)}}
@media (max-width:600px){.pipe{grid-template-columns:1fr}}
.pstep{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pstep .k{font-family:var(--mono);font-size:.72rem;color:var(--accent);letter-spacing:.08em}
.pstep h3{font-size:1.05rem}
.pstep p{color:var(--muted);font-size:.88rem}
.pstep.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pstep .bar{height:3px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:auto}
.pstep .bar b{display:block;height:100%;width:0;background:var(--accent);transition:width .6s}
.pstep.hl .bar b{width:100%}
/* architecture diagram */
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:680px;height:auto}
.diagram text{font-family:var(--body)}
/* calculator */
.calc{display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start}
@media (max-width:900px){.calc{grid-template-columns:1fr}}
.range{display:flex;flex-direction:column;gap:6px}
.range label{display:flex;justify-content:space-between;font-size:.88rem;font-weight:600}
.range label output{font-family:var(--mono);color:var(--accent)}
.range input{width:100%;accent-color:var(--accent)}
.routecmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.routecmp{grid-template-columns:1fr}}
.rbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rbox.win{border-color:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.rbox .big{font-family:var(--display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.meter{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex}

q1:"Ist das medizinische Beratung?", a1:"Nein. AskEU erklärt Rechte, Wege und Kosten. Es stellt keine Diagnosen, empfiehlt keine Behandlung und ersetzt keinen Arzt.",
q2:"Wie verhindert die KI erfundene Antworten?", a2:"Sie antwortet nur aus Passagen einer geprüften Wissensbasis. Ein zweiter Schritt prüft jede Aussage gegen ein Zitat und entfernt Unbelegtes. Passt nichts, sagt sie das.",
q3:"Welches KI-Modell nutzen Sie?", a3:"Ein führendes Sprachmodell per API mit Datenverarbeitung in der EU. Das System ist modellunabhängig, das Modell kann ersetzt werden.",
q4:"Speichern Sie meine Gesundheitsdaten?", a4:"Nein. Fragen brauchen kein Konto, und wir fragen nie nach Diagnosen oder Befunden. Pilotanmeldungen speichern nur E-Mail, Land, Status und Sprache.",
q5:"Wann ist es verfügbar?", a5:"Ein geschlossener Pilot ist für 2027 geplant. Tragen Sie sich ein, um zu den ersten Nutzern zu gehören.",
q6:"Welche Länder sind abgedeckt?", a6:"EU-Koordinierungsregeln gelten in allen 27 Mitgliedstaaten sowie Island, Liechtenstein, Norwegen und der Schweiz. Der Pilot ergänzt zuerst vertiefte Module für vier Länder.",
q7:"Kann meine Organisation teilnehmen?", a7:"Ja. Wir suchen NGOs, Arbeitgeber, Relocation-Dienste und Behörden als Pilotpartner. Schreiben Sie an hello@ask.eu.com.",

priv_h:"Datenschutzerklärung", priv_1:"AskEU funktioniert ohne personenbezogene Daten. Fragen sind ohne Konto möglich, und wir fragen nie nach Gesundheitsdaten, Diagnosen oder Befunden.", priv_2:"Für Pilotanmeldungen speichern wir E-Mail, Wohnland, Statuskategorie, bevorzugte Sprache und ggf. Organisation – nur zur Durchführung des Pilots.", priv_3:"Gesprächsprotokolle werden pseudonymisiert 90 Tage zur Genauigkeitsmessung aufbewahrt und dann gelöscht. Keine Werbetracker, keine Tracking-Cookies.", priv_4:"Daten werden in der EU gehostet. Auskunft, Berichtigung oder Löschung jederzeit unter privacy@ask.eu.com. Rechtsgrundlage: Art. 6 Abs. 1 lit. a, b und f DSGVO.",
terms_h:"Nutzungsbedingungen", terms_1:"AskEU bietet allgemeine Informationen zu Gesundheitsansprüchen, Kosten und Erstattungsverfahren in EU und EWR. Es ist kein Leistungserbringer, Versicherer, Anwalt oder Behörde.", terms_2:"Antworten werden von KI aus geprüften amtlichen Quellen erzeugt, doch Regeln ändern sich und Fälle unterscheiden sich. Bestätigen Sie Entscheidungen bei Kasse, Kontaktstelle oder Berater.", terms_3:"Während des Pilots ist der Dienst kostenlos. Geplante kostenpflichtige Dienste werden in Euro bepreist und vor dem Kauf beschrieben.", terms_4:"Das Extrahieren der Wissensbasis, Weiterverkauf von Antworten oder rechtswidrige Nutzung ist untersagt.",
disc_h:"Haftungsausschluss und Zweckbestimmung", disc_ip:"Zweckbestimmung: AskEU liefert administrative Informationen zu Gesundheitsansprüchen, Wegen, Kosten und Erstattung. Es ist nicht dazu bestimmt, Krankheiten zu diagnostizieren, zu verhüten, zu überwachen, zu behandeln oder zu lindern, und daher nicht als Medizinprodukt im Sinne der Verordnung (EU) 2017/745 ausgelegt.", disc_1:"Inhalte sind Information, keine medizinische, rechtliche oder finanzielle Beratung. Antworten erzeugt ein KI-System; Sie werden stets darauf hingewiesen.", disc_2:"Im medizinischen Notfall wählen Sie 112, die EU-weite Notrufnummer.", disc_3:"Erstattungsentscheidungen trifft Ihre Kasse oder Behörde, nicht AskEU.",
acc_h:"Erklärung zur Barrierefreiheit", acc_1:"Wir streben WCAG 2.1 Stufe AA an. Die Seite unterstützt Tastaturbedienung, sichtbaren Fokus, reduzierte Bewegung, helles und dunkles Design sowie Screenreader.", acc_2:"Ein vollständiges Barrierefreiheitsaudit ist Teil der Pilotphase. Bekannte Einschränkungen werden hier gelistet.", acc_3:"Melden Sie Barrieren an hello@ask.eu.com; wir antworten innerhalb von fünf Werktagen."

xm_p:["Your message is ready but not sent yet. Open your email app and press send, or copy the text and send it to hello@ask.eu.com.","Ihre Nachricht ist fertig, aber noch nicht gesendet. Öffnen Sie Ihr E-Mail-Programm und senden Sie sie ab, oder kopieren Sie den Text und schicken Sie ihn an hello@ask.eu.com.","Wiadomość jest gotowa, ale jeszcze nie wysłana. Otwórz program pocztowy i wyślij ją albo skopiuj tekst i wyślij na hello@ask.eu.com.","Повідомлення готове, але ще не надіслане. Відкрийте поштову програму й натисніть «Надіслати» або скопіюйте текст і відправте його на hello@ask.eu.com."],

/* sources page */
xs_h:["How we check sources","So prüfen wir Quellen","Jak sprawdzamy źródła","Як ми перевіряємо джерела"],
xs_lead:["Every rule AskEU uses comes from an official source, is read and checked by a person, and carries a date. This page shows how.","Jede Regel, die AskEU verwendet, stammt aus einer amtlichen Quelle, wird von einer Person gelesen und geprüft und trägt ein Datum. Hier sehen Sie, wie.","Każdy przepis, z którego korzysta AskEU, pochodzi z oficjalnego źródła, jest czytany i sprawdzany przez człowieka i ma datę. Tu pokazujemy, jak to działa.","Кожне правило, яким користується AskEU, походить з офіційного джерела, його читає й перевіряє людина, і воно має дату. Тут показано, як це працює."],
xs_s1_t:["Collect only official sources","Nur amtliche Quellen sammeln","Zbieramy wyłącznie źródła oficjalne","Беремо лише офіційні джерела"],
xs_s1_d:["We start from EU law, national legislation portals, ministries, public insurers and official contact points. Nothing else.","Wir gehen von EU-Recht, nationalen Gesetzesportalen, Ministerien, öffentlichen Kassen und amtlichen Anlaufstellen aus. Sonst nichts.","Zaczynamy od prawa UE, krajowych portali prawnych, ministerstw, publicznych ubezpieczycieli i oficjalnych punktów kontaktowych. Nic więcej.","Ми виходимо з права ЄС, національних правових порталів, міністерств, публічних страховиків і офіційних контактних пунктів. Нічого іншого."],
xs_s2_t:["Write the rule in plain words","Die Regel in einfachen Worten formulieren","Zapisujemy przepis prostymi słowami","Формулюємо правило простими словами"],
xs_s2_d:["A rule states one fact: who, what and under which condition. It links to the exact article or page it comes from.","Eine Regel nennt genau eine Tatsache: wer, was und unter welcher Bedingung. Sie verweist auf den genauen Artikel oder die genaue Seite.","Przepis opisuje jeden fakt: kto, co i pod jakim warunkiem. Prowadzi do dokładnego artykułu lub strony, z której pochodzi.","Правило описує один факт: хто, що і за якої умови. Воно веде до точної статті чи сторінки, з якої взяте."],
xs_s3_t:["Check it against the source","Mit der Quelle abgleichen","Sprawdzamy ze źródłem","Звіряємо з джерелом"],
xs_s3_d:["A person reads the rule next to its source. During the preview this is the founder, an EU lawyer. A second legal reviewer joins as the advisory board is formed.","Eine Person liest die Regel neben ihrer Quelle. In der Vorschau ist das die Gründerin, eine EU-Juristin. Eine zweite juristische Prüfung kommt mit dem Beirat hinzu.","Człowiek czyta przepis obok jego źródła. W wersji podglądowej robi to założycielka, prawniczka UE. Druga osoba prawnicza dołączy wraz z radą doradczą.","Людина читає правило поруч із його джерелом. У демо-версії це робить засновниця, юристка з права ЄС. Другий юридичний рецензент долучиться, коли сформується консультативна рада."],
xs_s4_t:["Date it and mark its status","Datieren und Status kennzeichnen","Datujemy i oznaczamy status","Ставимо дату й позначаємо статус"],
xs_s4_d:["Each rule shows when it was last checked. If the law is being changed, the rule is marked “changing” and answers warn the reader.","Jede Regel zeigt, wann sie zuletzt geprüft wurde. Wird das Gesetz gerade geändert, heißt die Regel „in Änderung“, und die Antworten warnen.","Każdy przepis pokazuje, kiedy był ostatnio sprawdzony. Gdy prawo się zmienia, przepis ma status „w zmianie”, a odpowiedzi ostrzegają czytelnika.","Кожне правило показує, коли його востаннє перевіряли. Якщо закон змінюється, правило отримує позначку «змінюється», а відповіді попереджають читача."],
xs_s5_t:["Re-check regularly","Regelmäßig erneut prüfen","Sprawdzamy ponownie","Перевіряємо повторно"],
xs_s5_d:["Rules are re-checked when a source changes and at least every three months. Reports from readers go straight into this queue.","Regeln werden erneut geprüft, wenn sich eine Quelle ändert, mindestens alle drei Monate. Meldungen von Leserinnen und Lesern landen direkt in dieser Warteschlange.","Przepisy sprawdzamy ponownie, gdy zmienia się źródło, i co najmniej raz na trzy miesiące. Zgłoszenia od czytelników trafiają prosto do tej kolejki.","Правила перевіряємо повторно, коли змінюється джерело, і щонайменше раз на три місяці. Повідомлення читачів потрапляють просто в цю чергу."],

xs_log1:["Library published: {n} rules, each with its source link. One rule on a planned benefits reform is marked as changing.","Bibliothek veröffentlicht: {n} Regeln, jede mit Quellenlink. Eine Regel zu einer geplanten Leistungsreform ist als „in Änderung“ markiert.","Opublikowano bibliotekę: {n} przepisów, każdy z linkiem do źródła. Jeden przepis o planowanej reformie świadczeń ma status „w zmianie”.","Опубліковано бібліотеку: {n} правил, кожне з посиланням на джерело. Одне правило про заплановану реформу виплат має статус «змінюється»."],
xs_limit:["The AI may only use these rules. If no rule applies, it says so and names who to ask.","Die KI darf nur diese Regeln verwenden. Passt keine Regel, sagt sie das und nennt, wen man fragen kann.","AI może korzystać wyłącznie z tych przepisów. Gdy żaden nie pasuje, mówi o tym i wskazuje, kogo zapytać.","AI може користуватися лише цими правилами. Якщо жодне не підходить, він так і каже й вказує, до кого звернутися."],

xp_lead:["Facts, text, logos and images for journalists, partners and anyone writing about AskEU.","Fakten, Texte, Logos und Bilder für Journalistinnen, Partner und alle, die über AskEU schreiben.","Fakty, teksty, logo i zdjęcia dla dziennikarzy, partnerów i wszystkich, którzy piszą o AskEU.","Факти, тексти, логотипи й зображення для журналістів, партнерів і всіх, хто пише про AskEU."],
xp_zip:["Download the full press kit (ZIP)","Gesamtes Pressekit herunterladen (ZIP)","Pobierz cały pakiet prasowy (ZIP)","Завантажити весь пакет для преси (ZIP)"],
xp_about_h:["About AskEU","Über AskEU","O AskEU","Про AskEU"],
xp_short_l:["Short (about 60 words)","Kurz (etwa 60 Wörter)","Krótko (ok. 60 słów)","Коротко (близько 60 слів)"],
xp_short:["AskEU is an AI guide that helps people understand their healthcare rights when they live, work or get treated in another EU country. Every answer is built only from checked official sources and shows them. AskEU works in English, German, Polish and Ukrainian. It is in development, with early access planned for 2027.","AskEU ist ein KI-Wegweiser, der Menschen hilft, ihre Gesundheitsrechte zu verstehen, wenn sie in einem anderen EU-Land leben, arbeiten oder behandelt werden. Jede Antwort entsteht nur aus geprüften amtlichen Quellen und zeigt sie an. AskEU spricht Englisch, Deutsch, Polnisch und Ukrainisch. Das Projekt ist in Entwicklung, der frühe Zugang ist für 2027 geplant.","AskEU to przewodnik oparty na AI, który pomaga zrozumieć prawa do opieki zdrowotnej osobom mieszkającym, pracującym lub leczącym się w innym kraju UE. Każda odpowiedź powstaje wyłącznie ze sprawdzonych źródeł urzędowych i je pokazuje. AskEU działa po angielsku, niemiecku, polsku i ukraińsku. Projekt jest w budowie, a wczesny dostęp planujemy na 2027 rok.","AskEU є AI-помічником, який допомагає зрозуміти свої медичні права тим, хто живе, працює чи лікується в іншій країні ЄС. Кожна відповідь будується лише на перевірених офіційних джерелах і показує їх. AskEU працює англійською, німецькою, польською та українською. Проєкт розробляється, ранній доступ заплановано на 2027 рік."],
xp_long_l:["Long (about 110 words)","Lang (etwa 110 Wörter)","Dłużej (ok. 110 słów)","Довше (близько 110 слів)"],
xp_long:["AskEU explains healthcare rights in the European Union in plain words. A person describes their situation, and the AI finds the rules that apply, writes the answer and links every point to an official source. If no checked rule applies, it says so instead of guessing. AskEU does not diagnose, give medical advice or ask for medical records. The project was started in September 2026 by EU lawyer Halyna Mysko in Lviv, Ukraine. It speaks English, German, Polish and Ukrainian from day one and will be free for individuals during early access, planned for 2027. AskEU is an independent project and is not affiliated with the European Union or its institutions.","AskEU erklärt Gesundheitsrechte in der Europäischen Union in einfachen Worten. Eine Person beschreibt ihre Situation, die KI findet die passenden Regeln, schreibt die Antwort und verknüpft jede Aussage mit einer amtlichen Quelle. Passt keine geprüfte Regel, sagt sie das, statt zu raten. AskEU stellt keine Diagnosen, gibt keine medizinischen Ratschläge und verlangt keine Krankenakten. Das Projekt wurde im September 2026 von der EU-Juristin Halyna Mysko in Lwiw, Ukraine, gestartet. Es spricht von Anfang an Englisch, Deutsch, Polnisch und Ukrainisch und ist im frühen Zugang, geplant für 2027, für Privatpersonen kostenlos. AskEU ist ein unabhängiges Projekt und nicht mit der Europäischen Union oder ihren Institutionen verbunden.","AskEU wyjaśnia prawa do opieki zdrowotnej w Unii Europejskiej prostymi słowami. Osoba opisuje swoją sytuację, a AI znajduje przepisy, które jej dotyczą, pisze odpowiedź i łączy każdy punkt z oficjalnym źródłem. Gdy nie pasuje żaden sprawdzony przepis, mówi o tym zamiast zgadywać. AskEU nie stawia diagnoz, nie udziela porad medycznych i nie prosi o dokumentację medyczną. Projekt rozpoczęła we wrześniu 2026 roku prawniczka UE Halyna Mysko we Lwowie. Działa po angielsku, niemiecku, polsku i ukraińsku od pierwszego dnia i będzie bezpłatny dla osób prywatnych we wczesnym dostępie, planowanym na 2027 rok. AskEU to niezależny projekt, niepowiązany z Unią Europejską ani jej instytucjami.","AskEU пояснює медичні права в Європейському Союзі простими словами. Людина описує свою ситуацію, а AI знаходить правила, які її стосуються, пише відповідь і прив’язує кожен пункт до офіційного джерела. Якщо жодне перевірене правило не підходить, він так і каже, а не вгадує. AskEU не ставить діагнозів, не дає медичних порад і не просить медичних записів. Проєкт розпочала у вересні 2026 року юристка з права ЄС Halyna Mysko у Львові. Він працює англійською, німецькою, польською та українською з першого дня і буде безкоштовним для приватних осіб під час раннього доступу, запланованого на 2027 рік. AskEU є незалежним проєктом і не пов’язаний з Європейським Союзом чи його інституціями."],

xp_b_p:["Use the logo as supplied. Do not change the colours, stretch it or add effects. Please write the name as AskEU, one word.","Verwenden Sie das Logo unverändert. Keine Farbänderungen, Verzerrungen oder Effekte. Bitte schreiben Sie den Namen als AskEU in einem Wort.","Używaj logo w oryginalnej postaci. Nie zmieniaj kolorów, nie rozciągaj i nie dodawaj efektów. Prosimy pisać nazwę jako AskEU, jednym słowem.","Використовуйте логотип без змін: не змінюйте кольори, не розтягуйте й не додавайте ефектів. Назву просимо писати як AskEU, одним словом."],

xp_c_p:["For interviews, quotes and questions write to the founder. We answer within two working days.","Für Interviews, Zitate und Fragen schreiben Sie an die Gründerin. Wir antworten innerhalb von zwei Werktagen.","W sprawie wywiadów, cytatów i pytań pisz do założycielki. Odpowiadamy w ciągu dwóch dni roboczych.","Щодо інтерв’ю, цитат і запитань пишіть засновниці. Відповідаємо протягом двох робочих днів."],
/* responsible AI */
xa_h:["Responsible AI and data protection","Verantwortungsvolle KI und Datenschutz","Odpowiedzialne AI i ochrona danych","Відповідальний AI і захист даних"],
xa_lead:["A short, honest summary of how AskEU handles AI risk and personal data. It is our own assessment, not a legal opinion or a certification.","Eine kurze, ehrliche Zusammenfassung, wie AskEU mit KI-Risiken und personenbezogenen Daten umgeht. Es ist unsere eigene Einschätzung, kein Rechtsgutachten und keine Zertifizierung.","Krótkie, uczciwe podsumowanie tego, jak AskEU podchodzi do ryzyka AI i danych osobowych. To nasza własna ocena, nie opinia prawna ani certyfikat.","Коротке й чесне резюме того, як AskEU підходить до ризиків AI та персональних даних. Це наша власна оцінка, а не юридичний висновок чи сертифікація."],
xa_meta:["Version 0.1 · November 2026 · Owner: Halyna Mysko, Founder & CEO · Next review: before public launch, then every six months","Version 0.1 · November 2026 · Verantwortlich: Halyna Mysko, Gründerin & CEO · Nächste Überprüfung: vor dem öffentlichen Start, danach alle sechs Monate","Wersja 0.1 · listopad 2026 · Odpowiedzialna: Halyna Mysko, założycielka i CEO · Następny przegląd: przed publicznym startem, potem co sześć miesięcy","Версія 0.1 · листопад 2026 · Відповідальна: Halyna Mysko, засновниця і CEO · Наступний перегляд: перед публічним запуском, далі раз на шість місяців"],
xa_pdf:["Download as PDF (English)","Als PDF herunterladen (Englisch)","Pobierz jako PDF (angielski)","Завантажити як PDF (англійською)"],
xa_1_h:["What AskEU is and is not","Was AskEU ist und was nicht","Czym AskEU jest, a czym nie","Чим AskEU є і чим не є"],
xa_1_p:["AskEU is an information service about healthcare rights. It does not diagnose, recommend treatment, handle medical records or make decisions about anyone. Using it needs no account, and it never asks for health data.","AskEU ist ein Informationsdienst zu Gesundheitsrechten. Er stellt keine Diagnosen, empfiehlt keine Behandlung, verarbeitet keine Krankenakten und entscheidet über niemanden. Die Nutzung braucht kein Konto, und nach Gesundheitsdaten wird nie gefragt.","AskEU to serwis informacyjny o prawach do opieki zdrowotnej. Nie stawia diagnoz, nie zaleca leczenia, nie przetwarza dokumentacji medycznej i nie podejmuje decyzji o nikim. Korzystanie nie wymaga konta, a o dane zdrowotne nigdy nie pytamy.","AskEU є інформаційним сервісом про медичні права. Він не ставить діагнозів, не радить лікування, не обробляє медичних записів і не ухвалює рішень щодо людей. Для користування не потрібен акаунт, а даних про здоров’я він ніколи не просить."],
xa_2_h:["EU AI Act: our assessment","EU-KI-Verordnung: unsere Einschätzung","Akt o AI UE: nasza ocena","Акт ЄС про AI: наша оцінка"],
xa_2:[["Transparency (Art. 50): people are told they are talking to an AI, and every AI-written answer is labelled as AI-generated.","Transparenz (Art. 50): Menschen wird gesagt, dass sie mit einer KI sprechen, und jede von der KI geschriebene Antwort ist als KI-generiert gekennzeichnet.","Przejrzystość (art. 50): ludzie wiedzą, że rozmawiają z AI, a każda odpowiedź napisana przez AI jest oznaczona jako wygenerowana przez AI.","Прозорість (ст. 50): людям повідомляють, що вони спілкуються з AI, а кожна відповідь, написана AI, позначена як створена AI."],["Risk class: we assess AskEU as a limited-risk system. It is not used to decide access to benefits or services and does not triage emergencies, so it does not fall under the high-risk uses in Annex III.","Risikoklasse: Wir stufen AskEU als System mit begrenztem Risiko ein. Es entscheidet nicht über den Zugang zu Leistungen oder Diensten und triagiert keine Notfälle, fällt also nicht unter die Hochrisiko-Anwendungen in Anhang III.","Klasa ryzyka: oceniamy AskEU jako system ograniczonego ryzyka. Nie decyduje o dostępie do świadczeń ani usług i nie dokonuje selekcji nagłych przypadków, więc nie podlega zastosowaniom wysokiego ryzyka z załącznika III.","Клас ризику: ми оцінюємо AskEU як систему обмеженого ризику. Він не вирішує питань доступу до виплат чи послуг і не сортує невідкладні випадки, тож не підпадає під високоризикові застосування з додатка III."],["Our role: we deploy a third-party general-purpose AI model. The rule library, the instructions and the checks are ours.","Unsere Rolle: Wir setzen ein KI-Modell eines Drittanbieters ein. Regelbibliothek, Anweisungen und Prüfungen stammen von uns.","Nasza rola: wdrażamy model AI ogólnego przeznaczenia innego dostawcy. Biblioteka przepisów, instrukcje i kontrole są nasze.","Наша роль: ми впроваджуємо модель AI загального призначення стороннього постачальника. Бібліотека правил, інструкції та перевірки наші."],["We will reassess if the scope changes, for example if a public body wants to use AskEU to decide eligibility.","Wir prüfen neu, wenn sich der Umfang ändert, zum Beispiel wenn eine Behörde AskEU für Anspruchsentscheidungen nutzen will.","Ocenimy to ponownie, gdy zmieni się zakres, na przykład gdy instytucja publiczna zechce używać AskEU do rozstrzygania o uprawnieniach.","Ми переоцінимо це, якщо зміниться обсяг, наприклад, якщо державна установа захоче використовувати AskEU для ухвалення рішень про право на виплати."]],
xa_3_h:["GDPR: our assessment","DSGVO: unsere Einschätzung","RODO: nasza ocena","GDPR: наша оцінка"],
xa_3:[["Data we process: for early access an email, country, status category, language and optionally an organisation and a question. Conversation logs are pseudonymised and kept for 90 days.","Daten, die wir verarbeiten: für den frühen Zugang E-Mail, Land, Statuskategorie, Sprache und optional Organisation und Frage. Gesprächsprotokolle werden pseudonymisiert und 90 Tage aufbewahrt.","Dane, które przetwarzamy: przy wczesnym dostępie e-mail, kraj, kategoria statusu, język oraz opcjonalnie organizacja i pytanie. Logi rozmów są pseudonimizowane i przechowywane 90 dni.","Дані, які ми обробляємо: для раннього доступу email, країна, категорія статусу, мова та за бажанням організація й запитання. Логи розмов псевдонімізуються й зберігаються 90 днів."],["Legal basis: consent, contract and legitimate interest (Art. 6(1)(a), (b), (f)). Data is hosted in the EU. People can ask for access, correction or deletion at privacy@ask.eu.com.","Rechtsgrundlage: Einwilligung, Vertrag und berechtigtes Interesse (Art. 6 Abs. 1 lit. a, b, f). Die Daten liegen in der EU. Auskunft, Berichtigung oder Löschung gibt es unter privacy@ask.eu.com.","Podstawa prawna: zgoda, umowa i prawnie uzasadniony interes (art. 6 ust. 1 lit. a, b, f). Dane są w UE. O dostęp, sprostowanie lub usunięcie można poprosić pod adresem privacy@ask.eu.com.","Правова підстава: згода, договір і легітимний інтерес (ст. 6(1)(a), (b), (f)). Дані зберігаються в ЄС. Доступ, виправлення чи видалення можна запитати на privacy@ask.eu.com."],["Sensitive data: we never ask for it, but people may type it into a free-text question. We warn against it, keep logs short and delete on request.","Sensible Daten: Wir fragen nie danach, aber Menschen können sie in eine Freitextfrage schreiben. Wir warnen davor, bewahren Protokolle kurz auf und löschen auf Anfrage.","Dane wrażliwe: nigdy o nie nie pytamy, ale ludzie mogą je wpisać w pytaniu. Ostrzegamy przed tym, krótko przechowujemy logi i usuwamy je na życzenie.","Чутливі дані: ми ніколи їх не запитуємо, але люди можуть вписати їх у вільне запитання. Ми застерігаємо від цього, зберігаємо логи недовго й видаляємо їх за запитом."],["DPIA: we assess that a full data protection impact assessment (Art. 35) is not required at this stage, because there is no systematic monitoring and no large-scale processing of health data. This summary is our lighter version. We will do a full DPIA before scaling or adding accounts or health-related features.","DSFA: Wir schätzen ein, dass eine vollständige Datenschutz-Folgenabschätzung (Art. 35) in dieser Phase nicht nötig ist, weil es keine systematische Überwachung und keine umfangreiche Verarbeitung von Gesundheitsdaten gibt. Diese Zusammenfassung ist unsere leichte Fassung. Vor einer Skalierung oder vor Konten oder gesundheitsbezogenen Funktionen machen wir eine vollständige DSFA.","DPIA: oceniamy, że pełna ocena skutków dla ochrony danych (art. 35) nie jest na tym etapie wymagana, bo nie ma systematycznego monitorowania ani przetwarzania danych zdrowotnych na dużą skalę. To podsumowanie jest naszą lżejszą wersją. Pełną DPIA wykonamy przed skalowaniem albo dodaniem kont lub funkcji związanych ze zdrowiem.","DPIA: ми вважаємо, що повна оцінка впливу на захист даних (ст. 35) на цьому етапі не потрібна, бо немає систематичного стеження й масової обробки даних про здоров’я. Це резюме є нашою полегшеною версією. Повну DPIA ми проведемо перед масштабуванням або додаванням акаунтів чи функцій, пов’язаних зі здоров’ям."]],
xa_4_h:["Main risks and what we do about them","Wichtigste Risiken und unsere Maßnahmen","Główne ryzyka i nasze działania","Основні ризики й що ми з ними робимо"],
xa_col:[["Risk","Risiko","Ryzyko","Ризик"],["What we do","Was wir tun","Co robimy","Що ми робимо"]],
xa_r:[
 [["Wrong or outdated answer","Falsche oder veraltete Antwort","Błędna lub nieaktualna odpowiedź","Хибна або застаріла відповідь"],["Answers may only use a closed library of checked rules. Every point links to a rule and its official source, and unverified points are removed. Rules that are changing carry a warning. If no rule applies, the AI says so.","Antworten dürfen nur eine geschlossene Bibliothek geprüfter Regeln nutzen. Jede Aussage verweist auf eine Regel und ihre amtliche Quelle, nicht belegte Aussagen werden entfernt. Regeln im Wandel tragen eine Warnung. Passt keine Regel, sagt die KI das.","Odpowiedzi mogą korzystać tylko z zamkniętej biblioteki sprawdzonych przepisów. Każdy punkt prowadzi do przepisu i jego oficjalnego źródła, a niepotwierdzone punkty są usuwane. Przepisy w zmianie mają ostrzeżenie. Gdy nic nie pasuje, AI mówi o tym wprost.","Відповіді можуть спиратися лише на закриту бібліотеку перевірених правил. Кожен пункт веде до правила та його офіційного джерела, а непідтверджені пункти прибираються. Правила, що змінюються, мають попередження. Якщо жодне правило не підходить, AI так і каже."]],
 [["Medical emergency","Medizinischer Notfall","Nagły wypadek medyczny","Невідкладний медичний стан"],["A 112 notice is on every page, and the AI is instructed to put calling 112 first when an emergency is mentioned. AskEU states clearly that it is not an emergency service.","Ein 112-Hinweis steht auf jeder Seite, und die KI ist angewiesen, bei einem erwähnten Notfall zuerst den Notruf 112 zu nennen. AskEU stellt klar, dass es kein Notdienst ist.","Na każdej stronie jest informacja o numerze 112, a AI ma instrukcję, by przy wzmiance o nagłym wypadku na pierwszym miejscu wskazać numer 112. AskEU jasno mówi, że nie jest służbą ratunkową.","На кожній сторінці є повідомлення про 112, а AI має інструкцію першим пунктом називати виклик 112, якщо йдеться про невідкладний стан. AskEU чітко каже, що він не є екстреною службою."]],
 [["Sensitive data typed in","Eingegebene sensible Daten","Wpisane dane wrażliwe","Чутливі дані, введені людиною"],["Neither the forms nor the AI ask for them, a notice says not to share them, logs are pseudonymised and deleted after 90 days, and people can ask for deletion any time.","Weder Formulare noch KI fragen danach, ein Hinweis bittet, sie nicht zu teilen, Protokolle werden pseudonymisiert und nach 90 Tagen gelöscht, und eine Löschung ist jederzeit möglich.","Ani formularze, ani AI o nie nie pytają, komunikat prosi, by ich nie podawać, logi są pseudonimizowane i usuwane po 90 dniach, a usunięcia można zażądać w każdej chwili.","Ні форми, ні AI їх не запитують, повідомлення просить їх не вказувати, логи псевдонімізуються й видаляються через 90 днів, а видалення можна попросити будь-коли."]],
 [["Vulnerable users and misunderstanding","Schutzbedürftige Nutzer und Missverständnisse","Osoby w trudnej sytuacji i nieporozumienia","Вразливі користувачі й непорозуміння"],["Newcomers and refugees may misread an answer or rely on it too much. We use plain wording in four languages, keep official terms in brackets so they match forms, always name who to ask, and repeat the disclaimer where answers appear.","Neuankömmlinge und Geflüchtete könnten eine Antwort falsch verstehen oder sich zu sehr darauf verlassen. Wir nutzen einfache Sprache in vier Sprachen, setzen amtliche Begriffe in Klammern, damit sie zu Formularen passen, nennen stets Ansprechstellen und wiederholen den Hinweis, wo Antworten erscheinen.","Osoby nowo przybyłe i uchodźcy mogą źle zrozumieć odpowiedź lub zbytnio na niej polegać. Używamy prostego języka w czterech językach, zostawiamy urzędowe terminy w nawiasach, by pasowały do formularzy, zawsze wskazujemy, kogo zapytać, i powtarzamy zastrzeżenie przy odpowiedziach.","Новоприбулі й біженці можуть неправильно зрозуміти відповідь або надто на неї покластися. Ми пишемо простими словами чотирма мовами, залишаємо офіційні терміни в дужках, щоб вони збігалися з формами, завжди вказуємо, до кого звернутися, і повторюємо застереження поруч із відповідями."]],
 [["Dependence on one AI provider","Abhängigkeit von einem KI-Anbieter","Zależność od jednego dostawcy AI","Залежність від одного постачальника AI"],["The rule library and the checks belong to AskEU and are separate from the model, so the model can be replaced. Only the question text is sent to the model, not early access data.","Regelbibliothek und Prüfungen gehören AskEU und sind vom Modell getrennt, das Modell lässt sich also ersetzen. An das Modell geht nur der Fragetext, nicht die Daten des frühen Zugangs.","Biblioteka przepisów i kontrole należą do AskEU i są oddzielone od modelu, więc model można wymienić. Do modelu trafia tylko treść pytania, nie dane wczesnego dostępu.","Бібліотека правил і перевірки належать AskEU й відокремлені від моделі, тож модель можна замінити. До моделі потрапляє лише текст запитання, а не дані раннього доступу."]],
 [["Security incident","Sicherheitsvorfall","Incydent bezpieczeństwa","Інцидент безпеки"],["No accounts and minimal data. Strict security headers and a content security policy, EU hosting and rate limits on the AI service. If personal data is affected, we report to the authority within 72 hours as the GDPR requires.","Keine Konten und minimale Daten. Strenge Sicherheits-Header und eine Content-Security-Policy, Hosting in der EU und Ratenbegrenzung beim KI-Dienst. Sind personenbezogene Daten betroffen, melden wir binnen 72 Stunden an die Behörde, wie es die DSGVO verlangt.","Brak kont i minimalna ilość danych. Rygorystyczne nagłówki bezpieczeństwa i polityka CSP, hosting w UE oraz limity zapytań do usługi AI. Jeśli naruszone zostaną dane osobowe, zgłosimy to organowi w ciągu 72 godzin, jak wymaga RODO.","Жодних акаунтів і мінімум даних. Суворі заголовки безпеки та політика CSP, хостинг у ЄС і ліміти запитів до сервісу AI. Якщо буде порушено персональні дані, ми повідомимо наглядовий орган протягом 72 годин, як вимагає GDPR."]]],
xa_5_h:["Next steps","Nächste Schritte","Następne kroki","Наступні кроки"],
xa_5:[["Independent legal review of this assessment before public launch.","Unabhängige juristische Prüfung dieser Einschätzung vor dem öffentlichen Start.","Niezależny przegląd prawny tej oceny przed publicznym startem.","Незалежний юридичний перегляд цієї оцінки перед публічним запуском."],["Accuracy testing against published targets before launch.","Genauigkeitstests an veröffentlichten Zielwerten vor dem Start.","Testy dokładności względem opublikowanych celów przed startem.","Перевірка точності за опублікованими цілями перед запуском."],["A full DPIA before scaling or adding accounts.","Eine vollständige DSFA vor Skalierung oder Konten.","Pełna DPIA przed skalowaniem lub dodaniem kont.","Повна DPIA перед масштабуванням або додаванням акаунтів."],["Questions: privacy@ask.eu.com","Fragen: privacy@ask.eu.com","Pytania: privacy@ask.eu.com","Запитання: privacy@ask.eu.com"]],

calc_lead:["There are two ways to get your health insurance to pay for planned treatment abroad. Enter the amounts below and see which one is cheaper for you.","Es gibt zwei Wege, wie Ihre Krankenkasse eine geplante Behandlung im Ausland bezahlt. Geben Sie unten die Beträge ein und sehen Sie, welcher für Sie günstiger ist.","Są dwa sposoby, aby ubezpieczenie zdrowotne pokryło planowe leczenie za granicą. Wpisz kwoty poniżej i zobacz, który jest dla Ciebie tańszy.","Є два способи, щоб страховка оплатила планове лікування за кордоном. Вкажіть суми нижче й побачите, який із них дешевший саме для вас."],

calc_in:["Your amounts (move the sliders)","Ihre Beträge (Regler verschieben)","Twoje kwoty (przesuń suwaki)","Ваші суми (пересувайте повзунки)"],
c_price:["Bill from the clinic abroad","Rechnung der Klinik im Ausland","Rachunek z kliniki za granicą","Рахунок від клініки за кордоном"],

c_cop:["Your own share under way 1 (S2)","Ihr Eigenanteil bei Weg 1 (S2)","Twój udział własny przy sposobie 1 (S2)","Ваша частка при способі 1 (S2)"],
s2_name:["Way 1: S2 form","Weg 1: S2-Formular","Sposób 1: formularz S2","Спосіб 1: форма S2"],
s2_desc:["Your insurer approves the treatment in advance. Then you pay only your share, like local residents.","Ihre Kasse genehmigt die Behandlung vorab. Danach zahlen Sie nur Ihren Anteil, wie Einheimische.","Ubezpieczyciel zatwierdza leczenie z góry. Potem płacisz tylko swój udział, jak miejscowi.","Страховка погоджує лікування наперед. Далі ви платите лише свою частку, як місцеві жителі."],
dir_name:["Way 2: refund under the EU Directive","Weg 2: Erstattung nach der EU-Richtlinie","Sposób 2: zwrot kosztów z dyrektywy UE","Спосіб 2: повернення коштів за директивою ЄС"],
dir_desc:["You pay the clinic first. Your insurer then refunds what the same treatment would cost at home. You cover the rest.","Sie zahlen zuerst die Klinik. Ihre Kasse erstattet, was die Behandlung zu Hause gekostet hätte. Den Rest tragen Sie.","Najpierw płacisz klinice. Ubezpieczyciel zwraca tyle, ile kosztowałoby to leczenie w kraju. Resztę dopłacasz Ty.","Ви спершу платите клініці самі. Потім страховка повертає суму, яку заплатила б за таке лікування вдома. Решту доплачуєте ви."],
youpay:["Paid from your pocket","Aus Ihrer Tasche","Z Twojej kieszeni","З вашої кишені"],
needs_auth:["Insurer’s approval needed before treatment","Genehmigung der Kasse vor der Behandlung nötig","Wymagana zgoda ubezpieczyciela przed leczeniem","Потрібен дозвіл страховки до лікування"],
maybe_auth:["Approval may be needed for hospital stays","Bei Klinikaufenthalt kann eine Genehmigung nötig sein","Przy pobycie w szpitalu może być wymagana zgoda","Для лікування з госпіталізацією дозвіл може знадобитися"],
better:["Better for you","Besser für Sie","Korzystniejsze dla Ciebie","Вигідніше для вас"],
covered:["Covered by insurance","Von der Kasse übernommen","Pokrywa ubezpieczenie","Покриває страховка"],

/* Checked rule library for the live prototype: EU-wide cross-border healthcare rights (EU-xx) and healthcare for people with temporary protection in Germany (DE-TP-xx).
   Each rule: id, topic, text (what the AI may say), source (name + url), checked (date), status: "ok" | "changing". */
var LIVE_LIB = {
  scope: "EU healthcare rights for travellers, residents, students and pensioners · plus Germany for people with temporary protection from Ukraine",
  checked: "2026-11-11",
  rules: [
  {id:"DE-TP-01", topic:"Legal status", text:"People who fled Ukraine get a residence permit for temporary protection under Section 24 of the German Residence Act from the local foreigners office (Ausländerbehörde). Until it is issued, a provisional certificate (Fiktionsbescheinigung) counts for access to benefits.", source:"Residence Act (AufenthG) § 24", url:"https://www.gesetze-im-internet.de/aufenthg_2004/__24.html", status:"ok"},
  {id:"DE-TP-02", topic:"Legal status", text:"EU countries extended temporary protection for people from Ukraine until 4 March 2028. For new applicants, protection is granted only to those who meet their military obligations in Ukraine; people already protected are not affected by this condition.", source:"EEAS, July 2026", url:"https://www.eeas.europa.eu/delegations/ukraine/eu-countries-agree-extend-temporary-protection-those-fleeing-ukraine-until-march-2028_en", status:"ok"},
  {id:"DE-TP-03", topic:"First steps", text:"Register your address at the local registration office (Bürgeramt / Einwohnermeldeamt) within two weeks of moving into a flat. The registration certificate (Meldebescheinigung) is needed for the residence permit, benefits and health insurance.", source:"Federal Registration Act (BMG) § 17", url:"https://www.gesetze-im-internet.de/bmg/__17.html", status:"ok"},
  {id:"DE-TP-04", topic:"Health insurance: who pays", text:"People who arrived before 1 April 2025 and need support receive basic income support (Bürgergeld) from the Jobcenter. With it they are members of a public health insurance fund (gesetzliche Krankenversicherung) and the Jobcenter pays the contributions. People who cannot work or are of pension age receive social assistance from the social welfare office (Sozialamt) instead and also get a health insurance card.", source:"Germany4Ukraine (Federal Government)", url:"https://www.germany4ukraine.de/EN/arbeit-und-soziales/ukrainer-sozialleistungen/seite_node.html", status:"ok"},
  {id:"DE-TP-05", topic:"Health insurance: who pays", text:"For people who arrived on or after 1 April 2025, the Federal Government adopted a bill (Leistungsrechtsanpassungsgesetz) in November 2025 to pay benefits under the Asylum Seekers' Benefits Act instead of Bürgergeld, with more limited healthcare. As of November 2026 the law is in the legislative process and its start date is not confirmed. Anyone in this group must check their current status with the Jobcenter or Sozialamt.", source:"Federal Ministry of Labour and Social Affairs (BMAS)", url:"https://www.bmas.de/DE/Service/Presse/Pressemitteilungen/2025/leistungsrechtsanpassungsgesetz-im-kabinett-beschlossen.html", status:"changing"},
  {id:"DE-TP-06", topic:"Health insurance: who pays", text:"Under the Asylum Seekers' Benefits Act, healthcare covers treatment of acute illness and pain, care in pregnancy and childbirth, vaccinations and necessary check-ups. Other treatment can be granted case by case if it is essential for health. Depending on the federal state, you get a treatment voucher (Behandlungsschein) from the Sozialamt or a health card.", source:"Asylum Seekers' Benefits Act (AsylbLG) §§ 4, 6", url:"https://www.gesetze-im-internet.de/asylblg/__4.html", status:"ok"},
  {id:"DE-TP-07", topic:"Health insurance: work", text:"If you work in a job that pays more than the mini-job limit, you are insured in a public health insurance fund through your employer. The employer registers you and the contribution is shared between you and the employer. A mini-job alone does not give you health insurance.", source:"Social Code Book V (SGB V) § 5", url:"https://www.gesetze-im-internet.de/sgb_5/__5.html", status:"ok"},
  {id:"DE-TP-08", topic:"Health insurance: choosing a fund", text:"You can choose any public health insurance fund (Krankenkasse) that is open in your area, for example AOK, TK, Barmer or DAK. The basic benefits are the same by law; funds differ slightly in extras and service languages. Tell the Jobcenter or your employer which fund you chose.", source:"SGB V § 173", url:"https://www.gesetze-im-internet.de/sgb_5/__173.html", status:"ok"},
  {id:"DE-TP-09", topic:"Health insurance: family", text:"Children and a spouse without their own income above a set limit are insured free of charge with the insured family member (family insurance, Familienversicherung). They must be registered with the same fund.", source:"SGB V § 10", url:"https://www.gesetze-im-internet.de/sgb_5/__10.html", status:"ok"},
  {id:"DE-TP-10", topic:"Health card", text:"After registration the fund sends an electronic health card (elektronische Gesundheitskarte) with your photo. Take it to every doctor, dentist and pharmacy. Until it arrives, the fund can give you a temporary certificate of insurance.", source:"SGB V § 291", url:"https://www.gesetze-im-internet.de/sgb_5/__291.html", status:"ok"},
  {id:"DE-TP-11", topic:"Doctors", text:"With a health card you can choose your family doctor (Hausarzt) freely. Most specialists can be seen without a referral, but a referral from your family doctor helps with appointments and is needed for some, such as radiology. Doctors with a public insurance licence (Kassenarzt) treat you at no charge for the visit.", source:"SGB V § 76", url:"https://www.gesetze-im-internet.de/sgb_5/__76.html", status:"ok"},
  {id:"DE-TP-12", topic:"Appointments", text:"The appointment service of the Associations of Statutory Health Insurance Physicians helps you find a doctor or specialist appointment: phone 116117 or the website 116117.de. For an urgent specialist appointment with a referral marked urgent, the service must offer one within four weeks.", source:"116117 · SGB V § 75", url:"https://www.116117.de/en/index.php", status:"ok"},
  {id:"DE-TP-13", topic:"Urgent help", text:"In a life-threatening emergency call 112 (ambulance and fire service), free from any phone. Hospitals treat emergencies whatever your insurance status. If you need a doctor outside opening hours but it is not life-threatening, call the on-call medical service at 116117. At night and on weekends at least one pharmacy is always on duty; find it at aponet.de.", source:"116117 · European emergency number 112", url:"https://www.116117.de/en/index.php", status:"ok"},
  {id:"DE-TP-14", topic:"Medicines", text:"Prescription medicines are collected at any pharmacy with the prescription (also as an e-prescription on the health card). Adults pay a co-payment of 10% of the price, at least 5 euros and at most 10 euros per item, never more than the price. Children and young people under 18 pay no co-payment. Non-prescription medicines are usually paid by adults themselves.", source:"SGB V §§ 31, 61", url:"https://www.gesetze-im-internet.de/sgb_5/__61.html", status:"ok"},
  {id:"DE-TP-15", topic:"Hospital", text:"For a hospital stay adults pay 10 euros per day for at most 28 days per calendar year. Planned hospital treatment needs a referral (Einweisung) from a doctor, except in an emergency.", source:"SGB V §§ 39, 61", url:"https://www.gesetze-im-internet.de/sgb_5/__39.html", status:"ok"},
  {id:"DE-TP-16", topic:"Co-payment limit", text:"Co-payments are capped at 2% of the household's yearly gross income, or 1% for people with a serious chronic illness. Keep receipts and apply to your health insurance fund for an exemption once you reach the limit. People on Bürgergeld reach it quickly because the limit is based on the standard rate.", source:"SGB V § 62", url:"https://www.gesetze-im-internet.de/sgb_5/__62.html", status:"ok"},
  {id:"DE-TP-17", topic:"Dentist", text:"Dental check-ups, fillings with standard material, root canal treatment and tooth extraction are covered by public health insurance. For crowns, bridges and dentures the fund pays a fixed subsidy (Festzuschuss) of 60% of the standard treatment; it rises to 70% or 75% with a full bonus booklet of yearly check-ups. Ask the dentist for a treatment and cost plan (Heil- und Kostenplan) before you start.", source:"SGB V §§ 28, 55", url:"https://www.gesetze-im-internet.de/sgb_5/__55.html", status:"ok"},
  {id:"DE-TP-18", topic:"Pregnancy and children", text:"Care in pregnancy, birth and after birth is covered, including check-ups with a gynaecologist and support from a midwife (Hebamme). Children have free check-ups (U-Untersuchungen) and recommended vaccinations; vaccinations recommended by the Standing Committee on Vaccination (STIKO) are free for all insured people.", source:"SGB V §§ 24c–24f, 26, 20i", url:"https://www.gesetze-im-internet.de/sgb_5/__24d.html", status:"ok"},
  {id:"DE-TP-19", topic:"Mental health", text:"Psychotherapy is covered by public health insurance. You can contact a licensed psychotherapist directly with your health card, without a referral, starting with an initial consultation (psychotherapeutische Sprechstunde). The appointment service at 116117 can help find one.", source:"SGB V § 92 · 116117", url:"https://www.116117.de/en/index.php", status:"ok"},
  {id:"DE-TP-20", topic:"Interpreters", text:"Public health insurance does not pay for interpreters at the doctor's. Ask whether the practice has staff who speak your language, bring someone you trust, or ask a migration counselling service about free interpreting in your town.", source:"Germany4Ukraine (Federal Government)", url:"https://www.germany4ukraine.de/EN/medizinische-versorgung/medizinische-hilfe-fluechtlinge/seite_node.html", status:"ok"},
  {id:"DE-TP-21", topic:"Glasses and aids", text:"Adults usually pay for glasses themselves; public insurance covers them for children and young people under 18 and for adults with severe sight problems. Medical aids such as hearing aids, wheelchairs or orthopaedic insoles are covered with a doctor's prescription, sometimes with a co-payment.", source:"SGB V § 33", url:"https://www.gesetze-im-internet.de/sgb_5/__33.html", status:"ok"},
  {id:"DE-TP-22", topic:"Travel", text:"The back of the German health card is the European Health Insurance Card (EHIC). It covers medically necessary care during temporary stays in other EU countries, Iceland, Liechtenstein, Norway and Switzerland, on the same terms as locals. It does not cover treatment in Ukraine or other non-EU countries; buy travel health insurance for such trips. Leaving Germany for a long time can affect your residence permit and benefits; tell the Jobcenter or Sozialamt before you travel.", source:"Regulation (EC) 883/2004 Art. 19", url:"https://eur-lex.europa.eu/eli/reg/2004/883/oj", status:"ok"},
  {id:"DE-TP-23", topic:"Help and advice", text:"Free and independent advice on patient rights and health insurance: Unabhängige Patientenberatung Deutschland (patientenberatung.de). Migration counselling for adults (Migrationsberatung für erwachsene Zuwanderer, MBE) helps with forms and offices, free of charge, in many languages. Questions about your insurance go to your health insurance fund; questions about benefits go to the Jobcenter or Sozialamt.", source:"Unabhängige Patientenberatung Deutschland", url:"https://www.patientenberatung.de/", status:"ok"},
  {id:"DE-TP-24", topic:"Foreign documents", text:"Bring any medical documents from Ukraine, such as discharge letters, test results and vaccination records, to the first appointment. Doctors decide whether a translation is needed; a list of current medicines with the active ingredients is especially useful.", source:"Germany4Ukraine (Federal Government)", url:"https://www.germany4ukraine.de/EN/medizinische-versorgung/medizinische-hilfe-fluechtlinge/seite_node.html", status:"ok"},
  {id:"DE-TP-25", topic:"Health insurance: own income", text:"If you receive no benefits and are not employed in Germany, for example if you live on savings or work remotely for a Ukrainian company, you are not insured automatically. Contact a public health insurance fund soon after arrival about voluntary membership: there are deadlines, and after them private insurance may be the only option. You pay the contribution yourself.", source:"Germany4Ukraine (Federal Government)", url:"https://www.germany4ukraine.de/EN/medizinische-versorgung/krankenversicherung-ukrainer/seite_node.html", status:"ok"},
  {id:"EU-01", topic:"Emergency", text:"In an emergency anywhere in the EU you can call 112 free of charge from any fixed or mobile phone to reach the emergency services. Some EU countries also still use their own national emergency numbers alongside 112.", source:"Your Europe: Emergencies", url:"https://europa.eu/youreurope/citizens/travel/security-and-emergencies/emergency/index_en.htm", status:"ok"},
  {id:"EU-02", topic:"EHIC: what it covers", text:"The European Health Insurance Card (EHIC) gives you medically necessary, state-provided healthcare during a temporary stay in another EU country (also Iceland, Liechtenstein, Norway, Switzerland). It covers any treatment that cannot wait until you get home. You get it on the same conditions, and at the same cost, as people insured in that country.", source:"European Commission: EHIC", url:"https://employment-social-affairs.ec.europa.eu/policies-and-activities/moving-working-europe/eu-social-security-coordination/european-health-insurance-card_en", status:"ok"},
  {id:"EU-03", topic:"EHIC: what it does not cover", text:"The EHIC does not cover private healthcare, rescue and repatriation (separate travel insurance is needed), lost or stolen property, or planned treatment in another EU country. It also does not cover care if you travel in order to get medical treatment.", source:"Your Europe: temporary stays", url:"https://europa.eu/youreurope/citizens/health/unplanned-healthcare/temporary-stays/index_en.htm", status:"ok"},
  {id:"EU-04", topic:"EHIC: costs and claims", text:"With the EHIC you are treated on the same terms as people insured in that country. If treatment is free for local residents it is free for you; if locals pay a patient fee, you pay it too. If you paid upfront, you can claim a refund from the national institution while you are still in the country, or from your own health insurer after you get home. Refunds follow the rules and rates of the country where you were treated.", source:"Your Europe: payments and reimbursements", url:"https://europa.eu/youreurope/citizens/health/unplanned-healthcare/payments-reimbursements/index_en.htm", status:"ok"},
  {id:"EU-05", topic:"EHIC: how to get it", text:"You should get the EHIC for free from your health insurer before you leave home. In some countries it is printed on the national health card, in others you must apply for it. Do not use websites that charge a fee for the card; contact your health insurer directly. In Denmark, Iceland, Liechtenstein, Norway and Switzerland, non-EU nationals can use the EHIC only if they are refugees residing in an EU member state or family members of an EU citizen.", source:"Your Europe: temporary stays", url:"https://europa.eu/youreurope/citizens/health/unplanned-healthcare/temporary-stays/index_en.htm", status:"ok"},
  {id:"EU-06", topic:"No EHIC or lost EHIC", text:"Without an EHIC you cannot be refused treatment, but you may have to pay upfront and claim the money back from your health insurer at home, and only for treatment you would be entitled to at home. The refund is capped at what the treatment costs in your home country, which can be less than you paid. For urgent care, the local health insurance authority may issue a Provisional Replacement Certificate; this is also available if your EHIC is lost or stolen abroad.", source:"Your Europe: payments and reimbursements", url:"https://europa.eu/youreurope/citizens/health/unplanned-healthcare/payments-reimbursements/index_en.htm", status:"ok"},
  {id:"EU-07", topic:"Public and private providers", text:"The EHIC is accepted only by doctors and hospitals that belong to the country's statutory (public) health system. At a private provider you pay the full price yourself, though you may be able to claim a partial refund. Carry your EHIC: it makes administration and reimbursement for public care much easier.", source:"Your Europe: going to a doctor or hospital abroad", url:"https://europa.eu/youreurope/citizens/health/unplanned-healthcare/going-to-doctor-hospital-abroad/index_en.htm", status:"ok"},
  {id:"EU-08", topic:"Planned treatment: two routes", text:"EU law gives you the right in certain circumstances to arrange medical treatment in another EU country, such as a specialist consultation, surgery or treatment for a specific condition. There are two ways: (1) you organise it yourself and claim reimbursement from your health insurer, or (2) your public health insurer approves it in advance and you receive an S2 form. Prior authorisation is not always needed.", source:"Your Europe: planned healthcare", url:"https://europa.eu/youreurope/citizens/health/planned-healthcare/right-to-treatment/index_en.htm", status:"ok"},
  {id:"EU-09", topic:"Planned treatment: when approval is needed", text:"Your health insurer may require prior authorisation for treatment that involves at least one overnight hospital stay, or that needs highly specialised and cost-intensive medical infrastructure or equipment. If approval is required and you do not get it, you may not be reimbursed. Check with your National Contact Point or insurer before you book.", source:"Directive 2011/24/EU, Art. 8; Your Europe", url:"https://eur-lex.europa.eu/eli/dir/2011/24/oj", status:"ok"},
  {id:"EU-10", topic:"Planned treatment: reimbursement amount", text:"If you organise treatment abroad yourself (Directive 2011/24/EU), your insurer reimburses only care that is among your benefits at home. The refund is capped at what your insurer would have paid for the same care at home, and never exceeds what you actually paid. Your insurer may choose to cover more. You may have to pay upfront. Travel and accommodation are generally your own responsibility.", source:"Directive 2011/24/EU, Art. 7; Your Europe", url:"https://eur-lex.europa.eu/eli/dir/2011/24/oj", status:"ok"},
  {id:"EU-11", topic:"Planned treatment: the S2 form", text:"If your public health insurer approves planned treatment abroad, it issues an S2 form (formerly E112). You send the S2 form to the insurance organisation in the country of treatment. Depending on the case, your insurer may arrange payment with the institution abroad so that you do not pay everything upfront. For treatment that is not part of your statutory insurance, approval can be given only if it cannot be obtained within a reasonable time at home.", source:"Your Europe: planned healthcare", url:"https://europa.eu/youreurope/citizens/health/planned-healthcare/right-to-treatment/index_en.htm", status:"ok"},
  {id:"EU-12", topic:"Who to ask: National Contact Points", text:"Each EU country has at least one National Contact Point for cross-border healthcare. It can advise on your rights, which treatments are reimbursed and how much, whether you need prior authorisation, how to apply and how to appeal. It also informs about providers and patient rights in the country of treatment. Your own health insurer handles the EHIC, reimbursement and authorisation. If your cross-border healthcare rights are not respected, you can turn to SOLVIT, which is free.", source:"Your Europe: information points", url:"https://europa.eu/youreurope/citizens/health/planned-healthcare/get-more-info/index_en.htm", status:"ok"},
  {id:"EU-13", topic:"Living in another EU country", text:"Which country is responsible for your health insurance depends on your economic status and where you live, not on your nationality. If you work in one country and live in another, you are entitled to treatment in both: register in the country where you work and get an S1 form (formerly E106) from its health insurance authority, which gives you the right to healthcare where you live.", source:"Your Europe: health insurance cover", url:"https://europa.eu/youreurope/citizens/health/when-living-abroad/health-insurance-cover/index_en.htm", status:"ok"},
  {id:"EU-14", topic:"Pensioners abroad", text:"If your pension from the country where you live includes healthcare rights, you and your family are covered there. If you have no pension or other income from your country of residence, you are covered there only if you would be entitled to treatment in the country that pays your pension: request an S1 from that country's institution and register it with the local health institution when you arrive.", source:"Your Europe: health insurance cover", url:"https://europa.eu/youreurope/citizens/health/when-living-abroad/health-insurance-cover/index_en.htm", status:"ok"},
  {id:"EU-15", topic:"Students abroad", text:"Students, researchers and trainees must have comprehensive health insurance in the host country. If you are not employed, the EHIC may be an option if you are eligible. If you are employed in the host country, you must join the local health scheme. If your home institution sends you abroad for under two years you stay in your home scheme: apply for an EHIC or S1 before leaving. Some national insurers cover study abroad only for a limited time, often for students over 28 or 30, who may then need local or private cover.", source:"Your Europe: health insurance cover", url:"https://europa.eu/youreurope/citizens/health/when-living-abroad/health-insurance-cover/index_en.htm", status:"ok"},
  {id:"EU-16", topic:"Posted workers and several countries", text:"Posted workers on assignments of under two years can stay insured in their home country. If you move to the country of the assignment, ask your home insurer for an S1, which covers you and your family there; give it to the local institution on arrival. If you work in several countries and at least 25% of your activity (time or income) is in your country of residence, you are usually covered there.", source:"Your Europe: health insurance cover", url:"https://europa.eu/youreurope/citizens/health/when-living-abroad/health-insurance-cover/index_en.htm", status:"ok"},
  {id:"EU-17", topic:"Jobseekers moving abroad", text:"If you receive unemployment benefits and move to look for work, get an EHIC before you go; it covers only necessary treatment while you receive those benefits. If you are not insured anywhere, the social security institutions decide which system covers you, and you will probably need healthcare cover in the new country.", source:"Your Europe: health insurance cover", url:"https://europa.eu/youreurope/citizens/health/when-living-abroad/health-insurance-cover/index_en.htm", status:"ok"},
  {id:"EU-18", topic:"Medicines and prescriptions", text:"A prescription issued by a doctor in one EU country is in principle valid in all other EU countries. The rules of the country where it is dispensed apply, for example limits on time or dosage, and the medicine may be unavailable or have a different name there. It should show the patient's name and date of birth, the date, the prescriber's details and signature, and the generic name, form, strength, quantity and dosage. Ask for a paper copy if you plan to use it abroad, because an e-prescription may not work outside your home country.", source:"Your Europe: prescriptions abroad", url:"https://europa.eu/youreurope/citizens/health/prescription-medicine-abroad/prescriptions/index_en.htm", status:"ok"}
  ]
};

function initCalc(){

  const h=document.getElementById("ch"), c=document.getElementById("cc");
  const upd=()=>{ const P=+p.value, H=+h.value, C=+c.value/100;
    const s2you=P*C, dref=Math.min(P,H), dyou=P-dref;
    document.getElementById("cpo").textContent=eur(P); document.getElementById("cho").textContent=eur(H); document.getElementById("cco").textContent=Math.round(C*100)+"%";
    document.getElementById("s2you").textContent=eur(s2you); document.getElementById("dyou").textContent=eur(dyou);
    document.getElementById("s2c").style.width=((1-C)*100)+"%"; document.getElementById("s2y").style.width=(C*100)+"%";
    document.getElementById("dc").style.width=(dref/P*100)+"%"; document.getElementById("dy").style.width=(dyou/P*100)+"%";
    const w = s2you<dyou?1:(dyou<s2you?2:0);

}
